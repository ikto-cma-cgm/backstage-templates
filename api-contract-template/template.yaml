apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: api-contract-template
  title: API Contract
  description: Crée le repo OpenAPI 3.0, enregistre l'API dans le Catalog, l'expose sur Kong et enregistre le client OAuth2 sur Ping Federate (optionnels).
  annotations:
    simpleicons.org/icon-slug: swagger
    backstage.io/techdocs-ref: dir:.
  tags:
    - application
    - openapi
    - standalone
    - composition
spec:
  type: library
  owner: group:default/it-development-software-engineering-developer-platform
  parameters:
    - title: API identity
      required: [name, description, owner]
      properties:
        name:
          title: API name
          type: string
          pattern: '^[a-z][a-z0-9-]*[a-z0-9]$'
          ui:help: 'Kebab-case, unique dans le Catalog. Ex: quote-pricing-api'
        description:
          title: Description
          type: string
          ui:help: "Une phrase décrivant l'API. Apparaîtra dans le Catalog."
        owner:
          title: Owner
          type: string
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              - kind: Group
          ui:help: 'Équipe responsable.'

    - title: Catalog
      required: [system, domain]
      properties:
        system:
          title: System
          type: string
          ui:help: 'System Backstage auquel cette API appartient. Ex: pricing'
        domain:
          title: Domain
          type: string
          ui:help: 'Domain métier. Ex: finance, shipping, platform'
        apiType:
          title: API type
          type: string
          enum: [system, business, experience]
          default: system
          ui:enumNames:
            - System (core asset API)
            - Business (orchestration API)
            - Experience (consumer-facing API)
          ui:help: 'HIP API-led connectivity tier.'
        hopexComponentCode:
          title: HOPEX code (optionnel)
          type: string
          pattern: '^$|^CP\d+$'
          ui:help: 'Ex: CP00141. Laisser vide si inconnu.'

    - title: Kong — API Gateway
      properties:
        exposeViaKong:
          title: Exposer via Kong API Gateway
          type: boolean
          default: false
          ui:help: "Crée la route Kong et protège l'API par défaut. L'upstream est un placeholder — à mettre à jour après le déploiement via le template « Register Service on Kong »."
        kongRoutePath:
          title: Route path (optionnel)
          type: string
          ui:help: 'Défaut : /api/{name}'

    - title: Ping Federate — OAuth2
      properties:
        registerOnPing:
          title: Enregistrer sur Ping Federate
          type: boolean
          default: false
          ui:help: "Crée le client OAuth2 sur Ping Federate (Keycloak en dev). Requis pour les API exposées à des consommateurs M2M ou utilisateur."
        pingGrantTypes:
          title: Grant types OAuth2
          type: array
          items:
            type: string
            enum:
              - client_credentials
              - authorization_code
          uniqueItems: true
          default:
            - client_credentials
          ui:widget: checkboxes
          ui:help: 'client_credentials = M2M. authorization_code = flux utilisateur.'
        pingScopes:
          title: Scopes OAuth2 (optionnel)
          type: string
          ui:help: 'Séparés par des virgules. Défaut : {name}:read,{name}:write'
        pingRedirectUris:
          title: Redirect URIs (optionnel)
          type: string
          ui:help: 'authorization_code uniquement. Ex: https://my-app.cma-cgm.com/callback'

    - title: Repository
      required: [repoProvider, repoOwner]
      properties:
        repoProvider:
          title: Provider
          type: string
          enum: [github, gitlab]
          default: github
        repoOwner:
          title: Owner
          type: string
          default: ikto-cma-cgm
      dependencies:
        repoProvider:
          oneOf:
            - properties:
                repoProvider:
                  enum: [github]
            - properties:
                repoProvider:
                  enum: [gitlab]
                gitlabHost:
                  title: GitLab Host
                  type: string
                  default: gitlab.com
                  ui:help: 'Ex: gitlab.com ou gitlab.cma-cgm.com'
              required: [gitlabHost]

  steps:
    # ── Skeleton ──────────────────────────────────────────────────────────────
    - id: fetch-skeleton
      name: Fetch skeleton
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          system: ${{ parameters.system }}
          domain: ${{ parameters.domain }}
          apiType: ${{ parameters.apiType or 'system' }}
          hopexComponentCode: ${{ parameters.hopexComponentCode }}
          repoProvider: ${{ parameters.repoProvider }}
          repoOwner: ${{ parameters.repoOwner }}
          gitlabHost: ${{ parameters.gitlabHost }}
          exposeViaKong: ${{ parameters.exposeViaKong }}
          kongRoutePath: ${{ parameters.kongRoutePath or '/api/' + parameters.name }}

    # ── Repository ────────────────────────────────────────────────────────────
    - id: publish-github
      name: Publish on GitHub
      if: ${{ parameters.repoProvider === 'github' }}
      action: publish:github
      input:
        repoUrl: github.com?owner=${{ parameters.repoOwner }}&repo=${{ parameters.name }}
        description: ${{ parameters.description }}

    - id: publish-gitlab
      name: Publish on GitLab
      if: ${{ parameters.repoProvider === 'gitlab' }}
      action: publish:gitlab
      input:
        repoUrl: ${{ parameters.gitlabHost }}?owner=${{ parameters.repoOwner }}&repo=${{ parameters.name }}
        defaultBranch: main
        description: ${{ parameters.description }}

    # ── Ping Federate (unitaire) — définit l'auth avant d'exposer le gateway ──
    - id: register-ping
      name: Register OAuth2 client on Ping Federate
      if: ${{ parameters.registerOnPing }}
      action: cma:ping:register-client
      input:
        clientId: ${{ parameters.name }}
        clientName: ${{ parameters.description }}
        grantTypes: ${{ parameters.pingGrantTypes or ['client_credentials'] }}
        scopes: ${{ parameters.pingScopes and parameters.pingScopes.split(',') or [parameters.name + ':read', parameters.name + ':write'] }}
        redirectUris: ${{ parameters.pingRedirectUris and parameters.pingRedirectUris.split(',') or [] }}

    # ── Kong (unitaire) — expose l'API en appliquant les contraintes d'auth ──
    - id: register-kong
      name: Register on Kong API Gateway
      if: ${{ parameters.exposeViaKong }}
      action: cma:kong:register-service
      input:
        serviceName: ${{ parameters.name }}
        routePath: ${{ parameters.kongRoutePath or '/api/' + parameters.name }}

    # ── Catalog ───────────────────────────────────────────────────────────────
    - id: register-catalog-github
      name: Register in catalog (GitHub)
      if: ${{ parameters.repoProvider === 'github' }}
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish-github'].output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml
        optional: true

    - id: register-catalog-gitlab
      name: Register in catalog (GitLab)
      if: ${{ parameters.repoProvider === 'gitlab' }}
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish-gitlab'].output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml
        optional: true

  output:
    links:
      - title: Repository
        url: ${{ steps['publish-github'].output.remoteUrl || steps['publish-gitlab'].output.remoteUrl }}
      - title: Open in Catalog
        icon: catalog
        url: ${{ steps['register-catalog-github'].output.entityRef || steps['register-catalog-gitlab'].output.entityRef }}
    text:
      - title: Next Steps
        content: |
          Spécification OpenAPI **${{ parameters.name }}** créée et enregistrée dans le Catalog.

          1. Clone : `git clone ${{ steps['publish-github'].output.remoteUrl || steps['publish-gitlab'].output.remoteUrl }}`
          2. Éditez `openapi.yaml` pour définir votre contrat API
          3. Pour générer le service Spring Boot : template **Implement API — Spring Boot** → sélectionnez `${{ parameters.name }}`
          ${{ parameters.exposeViaKong and '4. Route Kong active : `' + (parameters.kongRoutePath or '/api/' + parameters.name) + '` — protégée par key-auth. Mettre à jour l''upstream après déploiement via « Register Service on Kong ».' or '' }}
          ${{ parameters.registerOnPing and '5. Client Ping Federate créé — Token endpoint : `' + steps['register-ping'].output.tokenEndpoint + '`' or '' }}
